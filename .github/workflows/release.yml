name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Native FASM Binary
        shell: cmd
        run: |
          if not exist "asm\StackOverflowSearch.exe" (
            echo Native executable not found in asm/
            exit /b 1
          )
          echo Found Native FASM Binary: asm\StackOverflowSearch.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: asm/StackOverflowSearch.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
